<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/stylesFunciones.css" rel="stylesheet" />
    <link rel="icon" href="../img/js.png" sizes="32x32" type="image/png" />
    <title>Ficha de estudiante</title>
</head>

<body>
    <header>
        <div class="px-3 py-2 text-bg-dark fixed-top">
            <div class="container">
                <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                    <a href="../indexFunciones.html"
                        class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none">
                        <img src="../img/js.png" alt="" width="32" height="32" class="me-2" />
                    </a>

                    <ul class="nav col-12 col-lg-auto my-2 justify-content-center my-md-0 text-small nav-bar">
                        <li class="text-center">
                            <a href="recursividad.html" class="nav-link text-white">
                                <i class="bi bi-arrow-clockwise bi-2 d-block"></i>
                                Recursividad
                            </a>
                        </li>
                        <li class="text-center">
                            <a href="tabla.html" class="nav-link text-white">
                                <i class="bi bi-table bi-2 d-block"></i>
                                Creando una Tabla
                            </a>
                        </li>
                        <li class="text-center">
                            <a href="formulario.html" class="nav-link text-white">
                                <i class="bi bi-ui-checks bi-2 d-block"></i>
                                Formulario
                            </a>
                        </li>
                                            <li class="text-center nav-bar-li-active">
                            <a href="fichaEstudiante.html" class="nav-link text-white">
                                <i class="bi bi-person-lines-fill bi-2 d-block"></i>
                                Ficha de estudiante
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>
    <div class="container-lg">
                   <div class="row">
            <div class="col-12 shadow-lg p-3 mt-5 bg-body rounded">
                <h3>Ficha de estudiante</h3>
                <p>Ingrese los siete campos y presione Validar ficha. La fecha se escribe como día/mes/año.</p>
                <form id="idFormEstudiante" onsubmit="return false">
                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idCarnetEstudiante" placeholder="AB001" maxlength="5">
                                <label for="idCarnetEstudiante">Carnet</label>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idNombreEstudiante" placeholder="José Pérez">
                                <label for="idNombreEstudiante">Nombre completo</label>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idDuiEstudiante" placeholder="12345678-9" maxlength="10">
                                <label for="idDuiEstudiante">Número de DUI</label>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idNitEstudiante" placeholder="0614-010101-001-1" maxlength="17">
                                <label for="idNitEstudiante">Número de NIT</label>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idFechaEstudiante" placeholder="28/10/2005" maxlength="10">
                                <label for="idFechaEstudiante">Fecha de nacimiento (dd/mm/aaaa)</label>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idCorreoEstudiante" placeholder="nombre@dominio.com" maxlength="254">
                                <label for="idCorreoEstudiante">Correo electrónico</label>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="idEdadEstudiante" placeholder="21">
                                <label for="idEdadEstudiante">Edad (solo números)</label>
                            </div>
                        </div>
                    </div>
                    <button type="button" id="idBtnValidarEstudiante" class="btn btn-success">
                        <i class="bi bi-ui-checks"></i> Validar ficha
                    </button>
                    <button type="button" id="idBtnLimpiarEstudiante" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Limpiar formulario
                    </button>
                </form>
                <div id="idResultadoValidacion" class="p-3"></div>
            </div>
        </div>        
    </div>
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../js/fichaEstudiante.js" defer></script>
</body>

</html>
